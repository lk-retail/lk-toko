<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDCD17">
<title>LK Toko</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="icon" href="img/icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LK Toko">
<style>
:root{--y:#FDCD17;--k:#000;--g:#6b6b6b;--l:#f3f3f1;--line:#e6e4df;--r:#d93025;--rb:#fdecea;--ok:#1e8e3e;--okb:#e6f4ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#e9e7e2;color:var(--k);-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--l);position:relative;padding-bottom:90px}
button{font-family:inherit}
.top{background:var(--y);padding:16px 18px 18px}
.top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .hi{font-size:13px;opacity:.75}
.top .name{font-size:20px;font-weight:700;margin-top:2px}
.top .store{font-size:13px;margin-top:4px}
.chip{background:rgba(0,0,0,.08);border:0;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:600}
.alert{margin:12px 14px 0;background:var(--rb);color:var(--r);border:1px solid #f5c2bd;border-radius:12px;padding:10px 12px;font-size:14px}
.info{margin:12px 14px 0;background:#fff8d6;border:1px solid #f0dc8a;border-radius:12px;padding:10px 12px;font-size:13px}
.next{margin:14px;background:var(--k);color:#fff;border-radius:18px;padding:18px}
.next .lbl{font-size:12px;color:var(--y);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.next .t{font-size:24px;font-weight:700;margin-top:6px;line-height:1.25}
.next .s{font-size:14px;color:#cfcfcf;margin-top:6px;line-height:1.45}
.btn{display:block;width:100%;margin-top:14px;background:var(--y);color:#000;border:0;border-radius:12px;padding:17px;font-size:18px;font-weight:700}
.btn:disabled{opacity:.5}
.btn.red{background:var(--r);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#000;font-size:16px;padding:14px}
.next.late{background:#3a0d0a}
.card{margin:0 14px 12px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.card h3{font-size:13px;color:var(--g);font-weight:600;margin-bottom:10px}
.steps{display:flex;justify-content:space-between;position:relative}
.steps:before{content:"";position:absolute;left:18px;right:18px;top:13px;height:2px;background:var(--line)}
.st{position:relative;text-align:center;flex:1;font-size:11px;color:var(--g)}
.dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#bbb}
.st.ok .dot{background:#000;border-color:#000;color:var(--y)}
.st.now .dot{border-color:#000;color:#000}.st.now{color:#000;font-weight:700}
.st .tm{display:block;font-size:10px;margin-top:2px;color:var(--g);font-weight:400}
.pts{display:flex;align-items:center;justify-content:space-between}
.pts .big{font-size:30px;font-weight:800}.pts .big small{font-size:13px;font-weight:600;color:var(--g);margin-left:4px}
.pts .gap{font-size:13px;text-align:right}.pts .gap b{display:block;font-size:15px}
.sub{font-size:12px;color:var(--g);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.more{display:flex;gap:10px;margin:0 14px 12px}
.more div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:#000}
.more div.soon{opacity:.45}
.more svg,.nav svg{width:22px;height:22px;display:block;margin:0 auto 4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;font-size:11px;color:var(--g);text-decoration:none}
.nav a.on{color:#000;font-weight:700}.nav a.on svg{background:var(--y);border-radius:10px;width:44px;padding:0 11px}
.page{padding:16px 14px}
.page h2{font-size:20px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--g);margin:12px 0 6px}
input.in{width:100%;font-size:17px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%;padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px}
.seg button.on{background:#000;color:var(--y);border-color:#000;font-weight:700}
.photo{margin-top:10px;width:100%;aspect-ratio:3/4;background:#fff;border:2px dashed #ccc;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:15px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:15px}
.toggle input{width:24px;height:24px;accent-color:#000;flex:none}
.back{background:none;border:0;font-size:15px;color:var(--g);padding:4px 0 12px}
.res{text-align:center;padding:30px 14px}
.res .big{font-size:56px;font-weight:800}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:86%;text-align:center;z-index:9}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:8;font-size:16px;font-weight:600}
table.r{width:100%;border-collapse:collapse;font-size:14px}table.r td{padding:8px 4px;border-bottom:1px solid var(--line)}table.r td:last-child{text-align:right;font-weight:700}
.login{padding:40px 22px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 16px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbwRYWoMhFeSce8cyDNQm_9GozZMjE4DoU8zTDCij8V_fX_2Rvpef-CUK8OAjWrJO9M_/exec';
var L = localStorage.getItem('tk_lang') || 'id';
var S = { view: 'home' };
try { S.sess = JSON.parse(localStorage.getItem('tk_sess') || 'null'); } catch (e) { S.sess = null; }

// ---------- 文案（印尼文 / 中文）----------
var TX = {
  id: {
    login: 'Masuk', eid: 'ID Karyawan', pw: 'Password', wrong: 'ID atau password salah', locked: 'Terlalu banyak salah. Coba lagi 15 menit lagi',
    useHub: 'Akun ini untuk LK Hub. Mengalihkan…', notFound: 'ID tidak ditemukan. Cek lagi ID Karyawan kamu (contoh: ID-2026-08096).', err: 'Koneksi gagal, coba lagi', newpw: 'Buat password baru', newpw1: 'Password baru (min. 6 karakter)', newpw2: 'Ulangi password baru',
    pwdiff: 'Password tidak sama / terlalu pendek', save: 'Simpan', next: 'Langkah berikutnya', today: 'Hari ini', pts: 'Poin bulan ini', u: 'poin',
    steps: ['Absen', 'Cek Buka', 'Kerja', 'Laporan'], stepsM: ['Absen', 'Cek Buka', 'Kerja', 'Kondisi Toko'],
    absenT: 'Absen Masuk', absenS: function (s, p) { return 'Shift ' + s + '. Absen sekarang: ' + fmtP(p) + ' poin.'; }, absenB: 'Absen sekarang',
    lateT: function (m) { return 'Terlambat ' + m + ' menit'; }, lateS: function (p) { return 'Absen sekarang: ' + fmtP(p) + ' poin. Makin lama makin berkurang.'; },
    bukaT: 'Cek Buka Toko', bukaS: 'Cek alat, kebersihan, display + foto depan toko. Sekali sehari per toko.', bukaB: 'Mulai cek',
    workT: 'Selamat bekerja', workS: function (x) { return 'Laporan Akhir Shift dibuka 30 menit sebelum shift selesai (' + x + ').'; },
    noShift: 'Jam shift toko ini belum diisi. Hubungi Operation Manager.', noStore: 'Kamu belum terdaftar di toko mana pun. Hubungi HR.',
    in10: function (r) { return '<b>Top 10</b>peringkat ' + r; }, gap: function (g) { return '<b>' + fmtP(g).replace('+', '') + ' poin lagi</b>masuk Top 10'; }, gapNone: '<b>Absen tepat waktu</b>untuk masuk Top 10',
    todayP: function (p) { return 'Hari ini: ' + fmtP(p) + ' poin'; }, more: ['Perbaikan & Laporan', 'LK School', 'Barang'], soon: 'Segera',
    nav: ['Hari Ini', 'Poin', 'Saya'], back: '‹ Kembali', shift: 'Shift', selfie: 'Ambil selfie', retake: 'Foto ulang', send: 'Kirim absen',
    sending: 'Mengirim…', upl: 'Mengunggah foto…', needPhoto: 'Ambil foto dulu', got: 'Absen tercatat', ptsGot: 'poin', doneBuka: 'Toko READY ✓',
    alat: 'HP, tablet/POS, EDC, lampu & AC menyala', bersih: 'Toko bersih: lantai, rak & etalase', display: 'Display rapi & siap', fotoToko: 'Foto depan toko',
    sendBuka: 'Kirim — Toko READY', shiftN: { F: 'Full', M: 'Pagi', E: 'Malam' },
    rules: 'Aturan poin', rule: [['Datang ≥ 20 mnt lebih awal', '+3'], ['10–20 mnt lebih awal', '+2.5'], ['0–10 mnt lebih awal', '+2'], ['Telat 0–10 mnt', '0'], ['Telat 10–20 mnt', '−2'], ['Telat 20–30 mnt', '−3'], ['Telat > 30 mnt', '−5'], ['Tidak masuk tanpa izin', '−10']],
    logout: 'Keluar', lang: 'Bahasa', test: 'AKUN TES — tidak masuk peringkat'
  },
  zh: {
    login: '登录', eid: '工号', pw: '密码', wrong: '工号或密码不对', locked: '错误次数太多，15 分钟后再试',
    useHub: '这个账号用 LK Hub，正在跳转…', notFound: '找不到这个工号，请检查一下（例如 ID-2026-08096）。核心团队请用 LK Hub。', err: '网络失败，请再试一次', newpw: '设置新密码', newpw1: '新密码（至少 6 位）', newpw2: '再输一次新密码',
    pwdiff: '两次不一样或太短', save: '保存', next: '下一步', today: '今天', pts: '本月积分', u: '分',
    steps: ['打卡', '开店检查', '上班', '下班卡'], stepsM: ['打卡', '开店检查', '上班', '门店情况'],
    absenT: '上班打卡', absenS: function (s, p) { return '班次 ' + s + '。现在打卡：' + fmtP(p) + ' 分。'; }, absenB: '现在打卡',
    lateT: function (m) { return '已迟到 ' + m + ' 分钟'; }, lateS: function (p) { return '现在打卡：' + fmtP(p) + ' 分，越晚扣得越多。'; },
    bukaT: '开店检查', bukaS: '设备、卫生、陈列 + 门店正面照。每店每天一次。', bukaB: '开始检查',
    workT: '上班中', workS: function (x) { return '下班卡在下班前 30 分钟开放（' + x + '）。'; },
    noShift: '这家店的班次时间还没填，请联系运营经理。', noStore: '你还没有分配门店，请联系 HR。',
    in10: function (r) { return '<b>前 10</b>第 ' + r + ' 名'; }, gap: function (g) { return '<b>还差 ' + fmtP(g).replace('+', '') + ' 分</b>进前 10'; }, gapNone: '<b>准时打卡</b>就能进前 10',
    todayP: function (p) { return '今天：' + fmtP(p) + ' 分'; }, more: ['报修与反馈', 'LK School', '货品'], soon: '即将上线',
    nav: ['今天', '积分', '我的'], back: '‹ 返回', shift: '班次', selfie: '拍自拍', retake: '重拍', send: '提交打卡',
    sending: '提交中…', upl: '正在上传照片…', needPhoto: '请先拍照', got: '打卡成功', ptsGot: '分', doneBuka: '门店已 READY ✓',
    alat: '手机、平板/POS、EDC、灯和空调都已打开', bersih: '店内干净：地面、货架、柜台', display: '陈列整齐，可以营业', fotoToko: '门店正面照',
    sendBuka: '提交 — 门店 READY', shiftN: { F: '全天', M: '早班', E: '晚班' },
    rules: '积分规则', rule: [['提前 ≥ 20 分钟', '+3'], ['提前 10–20 分钟', '+2.5'], ['提前 0–10 分钟', '+2'], ['迟到 0–10 分钟', '0'], ['迟到 10–20 分钟', '−2'], ['迟到 20–30 分钟', '−3'], ['迟到 30 分钟以上', '−5'], ['无故缺勤', '−10']],
    logout: '退出登录', lang: '语言', test: '测试账号 — 不进排名'
  }
};
function t(k) { return TX[L][k]; }
function fmtP(p) { p = Number(p); return (p > 0 ? '+' : p < 0 ? '−' : '') + String(Math.abs(p)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var IC = {
  wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>'
};

// ---------- 后台调用：网络失败自动重试 ----------
function api(fn, args, tries) {
  tries = tries == null ? 2 : tries;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.err) throw new Error(j.err); return j.data; })
    .catch(function (e) {
      if (/SESSION_EXPIRED/.test(e.message)) { logout(); throw e; }
      if (tries > 0 && !/BAD_PW|LOCKED|NOT_MY|NO_/.test(e.message)) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return api(fn, args, tries - 1); });
      throw e;
    });
}
function toast(m) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2800); }
function busy(m) { var b = document.getElementById('busy'); if (!m) { if (b) b.remove(); return; } if (!b) { b = document.createElement('div'); b.id = 'busy'; b.className = 'busy'; document.body.appendChild(b); } b.textContent = m; }
function logout() { if (S.sess) api('logout', [S.sess.token], 0).catch(function () {}); S.sess = null; S.home = null; localStorage.removeItem('tk_sess'); S.view = 'home'; render(); }

// ---------- 照片：压缩到长边 1280、JPEG 0.7，上传更快 ----------
function compress(file) {
  return new Promise(function (ok, no) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var m = 1280, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = no; img.src = url;
  });
}
function upload(dataUrl, kind) {
  var name = kind + '_' + S.sess.user.nick + '_' + Date.now() + '.jpg';
  return api('uploadPhoto', [S.sess.token, name, 'image/jpeg', dataUrl.split(',')[1]], 3).then(function (r) { return r.id; });
}

// ---------- 页面 ----------
function render() {
  var a = document.getElementById('app');
  if (!S.sess) { a.innerHTML = vLogin(); return; }
  if (S.sess.mustChange) { a.innerHTML = vNewPw(); return; }
  var v = S.view, h = '';
  if (v === 'home') h = vHome(); else if (v === 'absen') h = vAbsen(); else if (v === 'buka') h = vBuka(); else if (v === 'poin') h = vPoin(); else if (v === 'saya') h = vSaya(); else if (v === 'res') h = vRes();
  if (v === 'home' || v === 'poin' || v === 'saya') h += vNav();
  a.innerHTML = h;
}
function vLogin() {
  return '<div class="login"><img class="logo" src="img/icon-192.png?v=2" alt=""><h2 style="text-align:center;margin-bottom:6px">LK Toko</h2>' +
    '<label class="f">' + t('eid') + '</label><input class="in" id="eid" autocapitalize="characters" autocomplete="username" placeholder="ID-2026-…">' +
    '<label class="f">' + t('pw') + '</label><input class="in" id="pw" type="password" autocomplete="current-password">' +
    '<button class="btn" onclick="doLogin()">' + t('login') + '</button>' +
    '<div style="text-align:center;margin-top:18px"><button class="chip" onclick="swLang()">' + (L === 'id' ? '中文' : 'Bahasa Indonesia') + '</button></div></div>';
}
function doLogin() {
  var id = document.getElementById('eid').value.trim(), pw = document.getElementById('pw').value;
  if (!id || !pw) return;
  busy('…');
  api('login', [id, pw]).then(function (r) {
    busy();
    if (!r.ok) { if (r.err === 'USE_HUB') { toast(t('useHub')); setTimeout(function () { location.href = r.url; }, 1500); return; } if (r.err === 'NOT_FOUND') return toast(t('notFound')); return toast(r.err === 'LOCKED' ? t('locked') : t('wrong')); }
    S.sess = { token: r.token, user: r.user, mustChange: r.mustChange }; localStorage.setItem('tk_sess', JSON.stringify(S.sess));
    if (!localStorage.getItem('tk_lang') && r.lang) L = r.lang;
    S.view = 'home'; render(); if (!r.mustChange) loadHome();
  }).catch(function () { busy(); toast(t('err')); });
}
function vNewPw() {
  return '<div class="login"><h2>' + t('newpw') + '</h2><label class="f">' + t('newpw1') + '</label><input class="in" id="p1" type="password" autocomplete="new-password">' +
    '<label class="f">' + t('newpw2') + '</label><input class="in" id="p2" type="password" autocomplete="new-password"><button class="btn" onclick="doNewPw()">' + t('save') + '</button></div>';
}
function doNewPw() {
  var a = document.getElementById('p1').value, b = document.getElementById('p2').value;
  if (a !== b || a.length < 6) return toast(t('pwdiff'));
  busy('…');
  api('changePassword', [S.sess.token, a]).then(function (r) { busy(); if (!r.ok) return toast(t('pwdiff')); S.sess.mustChange = false; localStorage.setItem('tk_sess', JSON.stringify(S.sess)); render(); loadHome(); })
    .catch(function () { busy(); toast(t('err')); });
}
function swLang() { L = L === 'id' ? 'zh' : 'id'; localStorage.setItem('tk_lang', L); if (S.sess && !S.sess.mustChange) api('setLang', [S.sess.token, L], 0).catch(function () {}); render(); }
function loadHome() {
  return api('home', [S.sess.token, S.storeId]).then(function (r) { S.home = r; S.storeId = r.store && r.store.id; if (S.view === 'home' || S.view === 'poin' || S.view === 'saya') render(); }).catch(function () { if (!S.home) toast(t('err')); });
}
function shiftLbl(s) { return s ? t('shiftN')[s.code] + ' ' + s.start + '–' + s.end : ''; }
function hmAdd(hm, d) { var p = hm.split(':'), m = +p[0] * 60 + +p[1] + d; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
function firstName(n) { return String(n || '').split(' ')[0]; }
// 首页：最上面只放「下一步」；门店的事写清是谁做的；迟到时按钮变红；早班最后一步是「门店情况」
function vHome() {
  var H = S.home, u = S.sess.user;
  var top = '<div class="top"><div class="row"><div><div class="hi">' + (H ? H.local.date : '') + '</div><div class="name">' + esc(u.fullName) + '</div>' +
    '<div class="store">' + (H && H.store ? esc(H.store.name) + (H.shift ? ' · ' + shiftLbl(H.shift) : '') : '') + '</div></div>' +
    '<button class="chip" onclick="swLang()">' + (L === 'id' ? '中文' : 'ID') + '</button></div></div>';
  if (u.test) top += '<div class="info">' + t('test') + '</div>';
  if (!H) return top + '<div class="card" style="margin-top:14px">…</div>';
  if (!H.store) return top + '<div class="alert">' + t('noStore') + '</div>';
  if (!H.store.shifts.length) return top + '<div class="alert">' + t('noShift') + '</div>';
  var morning = H.absen ? H.absen.shift === 'M' : (H.shift && H.shift.code === 'M');
  var stage = !H.absen ? 0 : !H.buka ? 1 : 2, nx = '';
  if (stage === 0) {
    if (H.lateBy > 0) nx = '<div class="next late"><div class="lbl">' + t('next') + '</div><div class="t">' + t('lateT')(H.lateBy) + '</div><div class="s">' + t('lateS')(H.previewPts) + '</div><button class="btn red" onclick="go(\'absen\')">' + t('absenB') + '</button></div>';
    else nx = '<div class="next"><div class="lbl">' + t('next') + '</div><div class="t">' + t('absenT') + '</div><div class="s">' + t('absenS')(shiftLbl(H.shift), H.previewPts) + '</div><button class="btn" onclick="go(\'absen\')">' + t('absenB') + '</button></div>';
  } else if (stage === 1) {
    nx = '<div class="next"><div class="lbl">' + t('next') + '</div><div class="t">' + t('bukaT') + '</div><div class="s">' + t('bukaS') + '</div><button class="btn" onclick="go(\'buka\')">' + t('bukaB') + '</button></div>';
  } else {
    var end = H.shift ? H.shift.end : '';
    nx = '<div class="next"><div class="lbl">' + t('next') + '</div><div class="t">' + t('workT') + '</div><div class="s">' + t('doneBuka') + ' ' + esc(firstName(H.buka.name)) + ' ' + H.buka.time + (end ? '<br>' + t('workS')(hmAdd(end, -30)) : '') + '</div></div>';
  }
  var names = morning ? t('stepsM') : t('steps');
  var tms = [H.absen ? H.absen.time : '', H.buka ? (H.buka.nick === u.nick ? H.buka.time : firstName(H.buka.name) + ' ' + H.buka.time) : '', '', ''];
  var steps = names.map(function (n, k) {
    var cls = k < stage ? 'ok' : (k === stage ? 'now' : '');
    return '<div class="st ' + cls + '"><div class="dot">' + (k < stage ? '✓' : k + 1) + '</div>' + n + (tms[k] && k < stage ? '<span class="tm">' + esc(tms[k]) + '</span>' : '') + '</div>';
  }).join('');
  var P = H.points;
  var gap = P.inTop10 ? t('in10')(P.rank) : (P.gap == null ? t('gapNone') : t('gap')(P.gap));
  var pts = '<div class="card"><h3>' + t('pts') + '</h3><div class="pts"><div class="big">' + P.total + '<small>' + t('u') + '</small></div><div class="gap" onclick="go(\'poin\')">' + gap + ' ›</div></div>' +
    (P.today ? '<div class="sub">' + t('todayP')(P.today) + '</div>' : '') + '</div>';
  var more = '<div class="more">' + [IC.wrench, IC.book, IC.box].map(function (ic, k) { return '<div class="soon">' + ic + t('more')[k] + '<br><small>' + t('soon') + '</small></div>'; }).join('') + '</div>';
  return top + nx + '<div class="card"><h3>' + t('today') + '</h3><div class="steps">' + steps + '</div></div>' + pts + more;
}
function vNav() {
  var items = [['home', IC.home], ['poin', IC.star], ['saya', IC.user]];
  return '<div class="nav">' + items.map(function (x, k) { return '<a href="#" class="' + (S.view === x[0] ? 'on' : '') + '" onclick="go(\'' + x[0] + '\');return false">' + x[1] + t('nav')[k] + '</a>'; }).join('') + '</div>';
}
function go(v) {
  S.view = v;
  if (v === 'absen') { S.photo = null; S.shift = S.home && S.home.shift ? S.home.shift.code : null; }
  if (v === 'buka') { S.photo = null; S.ck = { alat: false, bersih: false, display: false }; }
  render(); window.scrollTo(0, 0); if (v === 'home') loadHome();
}
// 上班打卡：班次自动选好，可以改 → 自拍 → 提交；时间以服务器为准
function vAbsen() {
  var sh = S.home.store.shifts;
  return '<div class="page"><button class="back" onclick="go(\'home\')">' + t('back') + '</button><h2>' + t('absenT') + '</h2>' +
    '<label class="f">' + t('shift') + '</label><div class="seg">' + sh.map(function (s) { return '<button class="' + (S.shift === s.code ? 'on' : '') + '" onclick="S.shift=\'' + s.code + '\';render()">' + shiftLbl(s) + '</button>'; }).join('') + '</div>' +
    '<label class="photo" for="cam">' + (S.photo ? '<img src="' + S.photo + '">' : t('selfie')) + '</label>' +
    '<input id="cam" type="file" accept="image/*" capture="user" style="display:none" onchange="pick(this)">' +
    '<button class="btn" onclick="sendAbsen()"' + (S.photo ? '' : ' disabled') + '>' + t('send') + '</button>' +
    (S.photo ? '<button class="btn ghost" onclick="document.getElementById(\'cam\').click()">' + t('retake') + '</button>' : '') + '</div>';
}
function pick(inp) { var f = inp.files && inp.files[0]; if (!f) return; busy('…'); compress(f).then(function (d) { busy(); S.photo = d; render(); }).catch(function () { busy(); toast(t('err')); }); }
function sendAbsen() {
  if (!S.photo) return toast(t('needPhoto'));
  busy(t('upl'));
  upload(S.photo, 'absen').then(function (pid) { busy(t('sending')); return api('checkIn', [S.sess.token, { storeId: S.home.store.id, shift: S.shift, photo: pid }], 2); })
    .then(function (r) { busy(); if (!r.ok) return toast(t('err')); S.res = { kind: 'absen', time: r.time, points: r.points, needBuka: r.needBuka }; S.view = 'res'; render(); loadHome(); })
    .catch(function () { busy(); toast(t('err')); });
}
function vRes() {
  var R = S.res;
  if (R.kind === 'absen') return '<div class="res"><div style="font-size:15px;color:var(--g)">' + t('got') + ' · ' + R.time + '</div><div class="big">' + fmtP(R.points) + '</div><div>' + t('ptsGot') + '</div>' +
    (R.needBuka ? '<button class="btn" onclick="go(\'buka\')">' + t('bukaT') + '</button>' : '') + '<button class="btn ghost" onclick="go(\'home\')">' + t('nav')[0] + '</button></div>';
  return '<div class="res"><div class="big">✓</div><div style="font-size:18px;font-weight:700">' + t('doneBuka') + '</div><div style="color:var(--g)">' + R.time + '</div><button class="btn ghost" onclick="go(\'home\')">' + t('nav')[0] + '</button></div>';
}
// 开店检查：3 个打勾 + 门店正面照，每店每天一次
function vBuka() {
  var c = S.ck, row = function (k) { return '<label class="toggle">' + t(k) + '<input type="checkbox" ' + (c[k] ? 'checked' : '') + ' onchange="S.ck.' + k + '=this.checked;render()"></label>'; };
  var ok = c.alat && c.bersih && c.display && S.photo;
  return '<div class="page"><button class="back" onclick="go(\'home\')">' + t('back') + '</button><h2>' + t('bukaT') + '</h2>' + row('alat') + row('bersih') + row('display') +
    '<label class="f">' + t('fotoToko') + '</label><label class="photo" for="cam2" style="aspect-ratio:4/3">' + (S.photo ? '<img src="' + S.photo + '">' : t('fotoToko')) + '</label>' +
    '<input id="cam2" type="file" accept="image/*" capture="environment" style="display:none" onchange="pick(this)">' +
    '<button class="btn" onclick="sendBuka()"' + (ok ? '' : ' disabled') + '>' + t('sendBuka') + '</button></div>';
}
function sendBuka() {
  busy(t('upl'));
  upload(S.photo, 'buka').then(function (pid) { busy(t('sending')); return api('openCheck', [S.sess.token, { storeId: S.home.store.id, alat: S.ck.alat, bersih: S.ck.bersih, display: S.ck.display, photo: pid }], 2); })
    .then(function (r) { busy(); if (!r.ok) return toast(t('err')); S.res = { kind: 'buka', time: r.time || '' }; S.view = 'res'; render(); loadHome(); })
    .catch(function () { busy(); toast(t('err')); });
}
function vPoin() {
  var P = S.home ? S.home.points : { total: 0 };
  return '<div class="top"><div class="name">' + t('pts') + '</div><div style="font-size:40px;font-weight:800;margin-top:6px">' + P.total + ' <small style="font-size:14px">' + t('u') + '</small></div></div>' +
    '<div class="card" style="margin-top:14px"><h3>' + t('rules') + '</h3><table class="r">' + t('rule').map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table></div>';
}
function vSaya() {
  var u = S.sess.user, H = S.home;
  return '<div class="top"><div class="name">' + esc(u.fullName) + '</div><div class="store">' + esc(u.nick) + ' · ' + esc(u.role) + '</div><div class="store">' + (H && H.stores ? H.stores.map(function (s) { return esc(s.name); }).join(', ') : '') + '</div></div>' +
    '<div class="page"><button class="btn ghost" onclick="swLang()">' + t('lang') + ': ' + (L === 'id' ? 'Bahasa Indonesia → 中文' : '中文 → Bahasa Indonesia') + '</button>' +
    '<button class="btn ghost" onclick="logout()">' + t('logout') + '</button></div>';
}
render();
if (S.sess && !S.sess.mustChange) loadHome();
fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'warm', args: [] }) }).catch(function () {});
</script>
</body>
</html>
