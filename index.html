<style>
:root{--y:#FDCD17;--k:#000;--g:#6b6b6b;--l:#f3f3f1;--line:#e6e4df;--r:#d93025;--rb:#fdecea;--ok:#1e8e3e;--okb:#e6f4ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#e9e7e2;color:var(--k);-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--l);position:relative;padding-bottom:90px}
button{font-family:inherit}
.top{background:var(--y);padding:calc(14px + env(safe-area-inset-top)) 18px 18px}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#000;z-index:100;pointer-events:none}
.top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .hi{font-size:13px;font-weight:600}
.top .store{cursor:pointer}
.ov{margin-top:10px;background:rgba(0,0,0,.07);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6}
.top .name{font-size:20px;font-weight:700;margin-top:2px}
.top .store{font-size:13px;margin-top:4px}
.chip{background:rgba(0,0,0,.08);border:0;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:600}
.alert{margin:12px 14px 0;background:var(--rb);color:var(--r);border:1px solid #f5c2bd;border-radius:12px;padding:10px 12px;font-size:14px}
.info{margin:12px 14px 0;background:#fff8d6;border:1px solid #f0dc8a;border-radius:12px;padding:10px 12px;font-size:13px}
.next{margin:14px;background:var(--k);color:#fff;border-radius:18px;padding:18px}
.next .lbl{font-size:12px;color:var(--y);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.next .t{font-size:24px;font-weight:700;margin-top:6px;line-height:1.25}
.next .s{font-size:14px;color:#cfcfcf;margin-top:6px;line-height:1.45}
.btn{display:block;width:100%;margin-top:14px;background:var(--y);color:#000;border:0;border-radius:12px;padding:17px;font-size:18px;font-weight:700}
.btn:disabled{opacity:.5}
.btn.red{background:var(--r);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#000;font-size:16px;padding:14px}
.next.late{background:#3a0d0a}
.card{margin:0 14px 12px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.card h3{font-size:13px;color:var(--g);font-weight:600;margin-bottom:10px}
.steps{display:flex;justify-content:space-between;position:relative}
.steps:before{content:"";position:absolute;left:18px;right:18px;top:13px;height:2px;background:var(--line)}
.st{position:relative;text-align:center;flex:1;font-size:11px;color:var(--g)}
.dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#bbb}
.st.ok .dot{background:#000;border-color:#000;color:var(--y)}
.st.now .dot{border-color:#000;color:#000}.st.now{color:#000;font-weight:700}
.st .tm{display:block;font-size:10px;margin-top:2px;color:var(--g);font-weight:400}
.pts{display:flex;align-items:center;justify-content:space-between}
.pts .big{font-size:30px;font-weight:800}.pts .big small{font-size:13px;font-weight:600;color:var(--g);margin-left:4px}
.pts .gap{font-size:13px;text-align:right}.pts .gap b{display:block;font-size:15px}
.sub{font-size:12px;color:var(--g);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.more{display:flex;gap:10px;margin:0 14px 12px}
.more div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:#000}
.more div.soon{opacity:.45}
.more svg,.nav svg{width:22px;height:22px;display:block;margin:0 auto 4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;font-size:11px;color:var(--g);text-decoration:none}
.nav a.on{color:#000;font-weight:700}.nav a.on svg{background:var(--y);border-radius:10px;width:44px;padding:0 11px}
.page{padding:16px 14px}
.page h2{font-size:20px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--g);margin:12px 0 6px}
input.in{width:100%;font-size:17px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%;padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px}
.seg button.on{background:#000;color:var(--y);border-color:#000;font-weight:700}
.photo{margin-top:10px;width:100%;aspect-ratio:3/4;background:#fff;border:2px dashed #ccc;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:15px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:15px}
.toggle input{width:24px;height:24px;accent-color:#000;flex:none}
.back{background:none;border:0;font-size:15px;color:var(--g);padding:4px 0 12px}
.res{text-align:center;padding:30px 14px}
.res .big{font-size:56px;font-weight:800}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:86%;text-align:center;z-index:9}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:8;font-size:16px;font-weight:600}
table.r{width:100%;border-collapse:collapse;font-size:14px}table.r td{padding:8px 4px;border-bottom:1px solid var(--line)}table.r td:last-child{text-align:right;font-weight:700}
.login{padding:40px 22px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 16px}
</style>

// ---------- 后台调用：网络失败自动重试 ----------
function api(fn, args, tries) {
  tries = tries == null ? 2 : tries;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.err) throw new Error(j.err); return j.data; })
    .catch(function (e) {
      if (/SESSION_EXPIRED/.test(e.message)) { logout(); throw e; }
      if (tries > 0 && !/BAD_PW|LOCKED|NOT_MY|NO_/.test(e.message)) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return api(fn, args, tries - 1); });
      throw e;
    });
}

function compress(file) {
  return new Promise(function (ok, no) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var m = 1280, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = no; img.src = url;
  });
}

  if (st === 2) body = ['visitors', 'buyers', 'googleReview', 'waJoin', 'wechatJoin', 'igFollow'].map(function (k) { return fld('cust', k, t(k)); }).join('');
  if (st === 3) body = CONDS.map(yn).join('');
  if (st === 4) body = '<label class="toggle">' + t('soDone') + '<input type="checkbox" ' + (c.so.done ? 'checked' : '') + ' onchange="S.cd.so.done=this.checked;render()"></label>' +
    (c.so.done ? '<label class="f">' + t('soBrands') + '</label><input class="in" value="' + esc(c.so.brands || '') + '" oninput="S.cd.so.brands=this.value"><label class="f">' + t('soDiff') + '</label><input class="in" value="' + esc(c.so.diff || '') + '" oninput="S.cd.so.diff=this.value">' : '') +
    '<label class="f">' + t('lock') + '</label><label class="photo" for="lk" style="aspect-ratio:4/3">' + (c.lock ? '<img src="' + c.lock + '">' : t('lock')) + '</label><input id="lk" type="file" accept="image/*" capture="environment" style="display:none" onchange="pick(this,\'lock\')">';
  var last = !c.full || st === 4;
  return '<div class="page"><button class="back" onclick="' + (st > 1 && c.full ? 'S.cd.step--;render()' : 'go(\'home\')') + '">' + t('back') + '</button>' +
    '<h2>' + (c.full ? t('cardT') : t('kondT')) + '</h2>' + (c.full ? '<div style="display:flex;gap:6px;margin-bottom:8px">' + steps.map(function (n, k) { return '<div style="flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:8px;' + (k === idx ? 'background:#000;color:#FDCD17;font-weight:700' : k < idx ? 'background:#e6e4df' : 'background:#fff;border:1px solid #e6e4df') + '">' + (k + 1) + '. ' + n + '</div>'; }).join('') + '</div>' : '') +
    body + (last ? '<button class="btn" onclick="sendCard()">' + t('submit') + '</button>' : '<button class="btn" onclick="S.cd.step++;render();window.scrollTo(0,0)">' + t('nextStep') + '</button>') + '</div>';
}
function sendCard() {
  var c = S.cd;
  if (CONDS.some(function (k) { return c.has[k] === undefined; })) return toast(L === 'id' ? 'Jawab semua kondisi toko (Ada / Tidak)' : '门店情况每一项都要选「有」或「没有」');
  if (c.full && !c.lock) return toast(t('needLock'));
  busy(t('upl'));
  var ups = c.shots.map(function (d, i) { return upload(d, 'struk' + i); });
  if (c.full) ups.push(upload(c.lock, 'kunci'));
  Promise.all(ups).then(function (ids) {
    busy(t('sending'));
    var lock = c.full ? ids.pop() : '';
    return api('submitCard', [S.sess.token, { storeId: S.home.store.id, kind: c.full ? 'FULL' : 'KONDISI', sales: c.sales, salesPhotos: ids, cust: c.cust, cond: c.cond, so: c.so, lockPhoto: lock }], 2);
  }).then(function (r) {
    busy(); if (!r.ok) return toast(t('err'));
    S.lastShare = { text: shareText(r), files: (c.shots.concat(c.lock ? [c.lock] : [])) };
    S.res = { kind: 'card', time: r.time, points: r.points }; if (S.home && S.home.card) S.home.card.done = { time: r.time, points: r.points }; S.view = 'res'; render(); loadHome();
  }).catch(function () { busy(); toast(t('err')); });
}
// 分享到 WhatsApp 群：文字按门店现在的日报格式排好，照片一起带上（手机支持时）
function shareText(r) {
  var c = S.cd, H = S.home, u = S.sess.user, k = c.cond, lines = [];
  var cond = function (key, lbl) { return '• ' + lbl + ' : ' + (k[key] ? k[key] : '-'); };
  if (c.full) {
    lines.push('🌙 LAPORAN PENUTUPAN HARIAN', '', '📅 Tanggal : ' + H.local.date, '📍 Toko : ' + H.store.name, '👤 Vaporista : ' + u.fullName, '',
      '💵 Tunai : ' + money(c.sales.cash), '• GRAB MERCHANT : ' + money(c.sales.grab), '📱 QRIS/EDC : ' + money(c.sales.qris), '💰 Penjualan Hari Ini : ' + money(num(c.sales.cash) + num(c.sales.qris) + num(c.sales.grab)), '',
      '👥 LAPORAN PELANGGAN', '• Jumlah Pengunjung : ' + num(c.cust.visitors), '• Jumlah Customer Membeli : ' + num(c.cust.buyers), '• Google Review : ' + num(c.cust.googleReview),
      '• Customer Bergabung WA Toko : ' + num(c.cust.waJoin), '• Customer Bergabung WeChat Toko : ' + num(c.cust.wechatJoin), '• Follow Instagram : ' + num(c.cust.igFollow), '');
  } else lines.push('📝 KONDISI TOKO', '📅 ' + H.local.date + ' · ' + H.store.name, '👤 ' + u.fullName, '');
  lines.push('📝 CATATAN', cond('stockOut', 'Stok Menipis / Habis'), cond('lostSales', 'Tidak jadi beli (stok habis)'), cond('requestNew', 'Permintaan produk belum tersedia'),
    cond('opsIssue', 'Kendala Operasional'), cond('defect', 'Barang rusak'), cond('competitor', 'Kompetitor'), cond('idea', 'Ide / masukan'));
  if (c.full) lines.push('', '📋 SO : ' + (c.so.done ? (c.so.brands || '-') + ' · Selisih : ' + (c.so.diff || '0') : '-'));
  return lines.join('\n');
}
function share() {
  var sh = S.lastShare; if (!sh) return;
  var files = [];
  try { files = sh.files.map(function (d, i) { var b = atob(d.split(',')[1]), a = new Uint8Array(b.length); for (var j = 0; j < b.length; j++) a[j] = b.charCodeAt(j); return new File([a], 'foto' + (i + 1) + '.jpg', { type: 'image/jpeg' }); }); } catch (e) { files = []; }
  if (navigator.canShare && files.length && navigator.canShare({ files: files })) { navigator.share({ text: sh.text, files: files }).catch(function () {}); return; }
  if (navigator.share) { navigator.share({ text: sh.text }).catch(function () {}); return; }
  location.href = 'https://wa.me/?text=' + encodeURIComponent(sh.text);
}
// ---------- 我的记录：最近 7 天 ----------
function calLoad(ym) {
  var key = 'tk_cal_' + (S.sess.user.nick || '').toLowerCase() + '_' + (ym || 'cur');
  try { var c = JSON.parse(localStorage.getItem(key) || 'null'); if (c) { S.cal = c; S.calYm = c.ym; } else S.cal = null; } catch (e) { S.cal = null; }
  if (S.view === 'rec') render();
  api('myMonth', [S.sess.token, ym || '']).then(function (r) { S.cal = r; S.calYm = r.ym; try { localStorage.setItem(key, JSON.stringify(r)); } catch (e) {} if (S.view === 'rec') render(); }).catch(function () { if (!S.cal) toast(t('err')); });
}
function calMove(n) { var y = +S.calYm.slice(0, 4), m = +S.calYm.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; S.calSel = null; calLoad(y + '-' + ('0' + (m + 1)).slice(-2)); }
function calStat(dt, D, C) {
  if (D && D.absen) { if (!D.card) return dt < C.today ? 'red' : 'live'; return (D.absen.diff > 0 || D.card.early > 10) ? 'yellow' : 'green'; }
  if (dt > C.today) return C.sched[dt] ? 'plan' : 'none';
  return dt < C.today ? 'grey' : (C.sched[dt] ? 'plan' : 'none');
}
var CAL_BG = { green: '#34a853', yellow: '#fbbc04', red: '#ea4335', live: '#ceead6', grey: '#e3e3e0', plan: '#fff', none: '#fff' };
function vRec() {
  var C = S.cal, h = '<div class="page"><button class="back" onclick="go(\'home\')">' + t('back') + '</button><h2>' + t('records') + '</h2>';
  if (!C) return h + '<div class="card" style="margin:0">…</div></div>';
  var y = +C.ym.slice(0, 4), m = +C.ym.slice(5, 7), first = new Date(Date.UTC(y, m - 1, 1)), nd = new Date(Date.UTC(y, m, 0)).getUTCDate(), lead = (first.getUTCDay() + 6) % 7;
  var sum = [0, 0, 0, 0, 0], cells = '';
  var prevN = new Date(Date.UTC(y, m - 1, 0)).getUTCDate();
  for (var k = 0; k < lead; k++) cells += '<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#cfcfcb">' + (prevN - lead + 1 + k) + '</div>';
  for (var d = 1; d <= nd; d++) {
    var dt = C.ym + '-' + ('0' + d).slice(-2), D = C.days[dt], st = calStat(dt, D, C);
    if (D && D.absen) { sum[0]++; if (D.absen.diff > 0) sum[2]++; if (D.card && D.card.early > 10) sum[3]++; if (D.card && D.absen.diff <= 0 && D.card.early <= 10) sum[1]++; if (!D.card && dt < C.today) sum[4]++; }
    var dark = st === 'green' || st === 'red';
    cells += '<div onclick="S.calSel=\'' + dt + '\';render()" style="aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;background:' + CAL_BG[st] + ';color:' + (dark ? '#fff' : '#000') +
      ';border:' + (dt === C.today ? '2.5px solid #000' : st === 'plan' ? '1.5px dashed #9aa0a6' : st === 'none' ? '1px solid #eee' : '0') + '">' + d + '</div>';
  }
  var tail = (7 - (lead + nd) % 7) % 7;
  for (var k2 = 1; k2 <= tail; k2++) cells += '<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#cfcfcb">' + k2 + '</div>';
  var nav = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button class="back" style="margin:0;font-size:26px;padding:0 14px" onclick="calMove(-1)">‹</button><b style="font-size:17px">' + (L === 'id' ? ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m - 1] + ' ' + y : y + '年' + m + '月') + '</b><button class="back" style="margin:0' + (C.ym >= C.today.slice(0, 7) ? ';visibility:hidden' : '') + ';font-size:26px;padding:0 14px" onclick="calMove(1)">›</button></div>';
  var sumH = '<div style="display:flex;gap:6px;margin-bottom:12px">' + t('calSum').map(function (n, k) { return '<div style="flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 0"><div style="font-size:18px;font-weight:800' + (k >= 2 && sum[k] ? ';color:' + (k === 4 ? '#ea4335' : '#b06000') : '') + '">' + sum[k] + '</div><div style="font-size:11px;color:var(--g)">' + n + '</div></div>'; }).join('') + '</div>';
  var grid = '<div class="card" style="margin:0 0 10px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--g);margin-bottom:6px">' + t('wk').map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">' + cells + '</div></div>';
  var lg = t('calLeg'), leg = '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:#3c4043;margin-bottom:6px">' + ['green', 'yellow', 'red', 'live', 'grey', 'plan'].map(function (k) { return '<span style="display:flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;display:inline-block;background:' + CAL_BG[k] + (k === 'plan' ? ';border:1.5px dashed #9aa0a6' : '') + '"></i>' + lg[k] + '</span>'; }).join('') + '</div><div style="font-size:12px;color:var(--g)">' + t('calHint') + '</div>';
  return h + nav + sumH + grid + leg + '</div>' + (S.calSel ? calPop(S.calSel) : '');
}
function calPop(dt) {
  var C = S.cal, D = C.days[dt] || {}, st = calStat(dt, C.days[dt], C), lg = t('calLeg'), P = C.sched[dt], rows = [];
  var row = function (a, b) { rows.push('<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #f0efeb;font-size:15px"><span style="color:var(--g)">' + a + '</span><span style="text-align:right;font-weight:600">' + b + '</span></div>'); };
  if (P) row(t('calPlan'), t('shiftN')[P.shift] + ' ' + P.start + '–' + P.end);
  if (D.absen) {
    row(t('calIn'), D.absen.time + ' · ' + (D.absen.diff > 0 ? t('calLate')(D.absen.diff) : D.absen.diff < 0 ? t('calEarly')(-D.absen.diff) : t('calOnTime')) + '<br><small style="color:var(--g);font-weight:400">' + t('shiftN')[D.absen.shift] + ' ' + D.absen.start + '–' + D.absen.end + ' · ' + esc(D.absen.store) + '</small>');
    if (D.buka) row(t('calBuka'), D.buka.time);
    row(t('calOut'), D.card ? D.card.time + ' · ' + (D.card.early > 10 ? t('calOutEarly')(D.card.early) : t('calOnTime')) + '<br><small style="color:var(--g);font-weight:400">' + t('recT')[D.card.kind] + '</small>' : t('calNone'));
    if (D.card && D.card.kind === 'FULL' && D.card.total) row(t('calSales'), money(D.card.total));
    var n = D.card && D.card.notes ? Object.keys(D.card.notes) : [];
    if (n.length) rows.push('<div style="padding:10px 0 2px;border-top:1px solid #f0efeb;font-size:13px;color:var(--g)">' + t('calNote') + '</div>' + n.map(function (k) { return '<div style="font-size:14px;padding:4px 0"><b>' + t(k) + '</b><br>' + esc(D.card.notes[k]) + '</div>'; }).join(''));
  } else if (!P) rows.push('<div style="padding:12px 0;color:var(--g)">' + t('calNoRec') + '</div>');
  var dd = new Date(dt + 'T00:00:00Z'), wd = t('wk')[(dd.getUTCDay() + 6) % 7];
  return '<div onclick="if(event.target===this){S.calSel=null;render()}" style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:50"><div style="background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><i style="width:14px;height:14px;border-radius:4px;display:inline-block;background:' + CAL_BG[st] + (st === 'plan' || st === 'none' ? ';border:1.5px dashed #9aa0a6' : '') + '"></i><b style="font-size:17px">' + dayLbl(dt) + '</b></div>' +
    (st !== 'none' ? '<div style="font-size:14px;margin-bottom:6px">' + (st === 'yellow' ? [D.absen.diff > 0 ? t('calLate')(D.absen.diff) : '', D.card.early > 10 ? t('calOutEarly')(D.card.early) : ''].filter(Boolean).join(' · ') : lg[st]) + '</div>' : '') + rows.join('') +
    '<button class="btn ghost" style="margin-top:12px" onclick="S.calSel=null;render()">' + t('calClose') + '</button></div></div>';
}
render();
if (S.sess && !S.sess.mustChange) loadHome();
fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'warm', args: [] }) }).catch(function () {});
</script>
