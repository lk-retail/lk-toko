<style>
:root{--y:#FDCD17;--k:#000;--g:#6b6b6b;--l:#f3f3f1;--line:#e6e4df;--r:#d93025;--rb:#fdecea;--ok:#1e8e3e;--okb:#e6f4ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#e9e7e2;color:var(--k);-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--l);position:relative;padding-bottom:90px}
button{font-family:inherit}
.top{background:var(--y);padding:14px 18px 18px}
/* 顶部黑条（和 LK Hub 一样）：一直贴在最上面，iOS 会用它的黑色填状态栏，不再起雾 */
.hb{position:sticky;top:0;z-index:30;background:#111;color:#fff;height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;justify-content:space-between;font-size:18px}
.hb b{color:var(--y);margin-right:6px}
.hb .lang{border:1px solid var(--y);color:var(--y);background:none;border-radius:8px;padding:4px 10px;font-size:14px;font-family:inherit}
.pf{position:relative;background:#fff;color:#111;border-radius:14px;border:1px solid var(--line);border-left:4px solid var(--y);margin:12px 14px 0;padding:10px 12px;z-index:6}
.pf .av{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:#111 center/cover no-repeat;color:var(--y);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--y);cursor:pointer}
.pf .gear{position:absolute;top:50%;transform:translateY(-50%);right:6px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9aa0a6;cursor:pointer}

.top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .hi{font-size:13px;font-weight:600}
.top .store{cursor:pointer}
.ov{margin-top:10px;background:rgba(0,0,0,.07);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6}
.top .name{font-size:20px;font-weight:700;margin-top:2px}
.top .store{font-size:13px;margin-top:4px}
.chip{background:rgba(0,0,0,.08);border:0;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:600}
.alert{margin:12px 14px 0;background:var(--rb);color:var(--r);border:1px solid #f5c2bd;border-radius:12px;padding:10px 12px;font-size:14px}
.info{margin:12px 14px 0;background:#fff8d6;border:1px solid #f0dc8a;border-radius:12px;padding:10px 12px;font-size:13px}
.next{margin:14px;background:var(--k);color:#fff;border-radius:18px;padding:18px}
.next .lbl{font-size:12px;color:var(--y);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.next .t{font-size:24px;font-weight:700;margin-top:6px;line-height:1.25}
.next .s{font-size:14px;color:#cfcfcf;margin-top:6px;line-height:1.45}
.btn{display:block;width:100%;margin-top:14px;background:var(--y);color:#000;border:0;border-radius:12px;padding:17px;font-size:18px;font-weight:700}
.btn:disabled{opacity:.5}
.btn.red{background:var(--r);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#000;font-size:16px;padding:14px}
.next.late{background:#3a0d0a}
.card{margin:0 14px 12px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.card h3{font-size:13px;color:var(--g);font-weight:600;margin-bottom:10px}
.steps{display:flex;justify-content:space-between;position:relative}
.steps:before{content:"";position:absolute;left:18px;right:18px;top:13px;height:2px;background:var(--line)}
.st{position:relative;text-align:center;flex:1;font-size:11px;color:var(--g)}
.dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#bbb}
.st.ok .dot{background:#000;border-color:#000;color:var(--y)}
.st.now .dot{border-color:#000;color:#000}.st.now{color:#000;font-weight:700}
.st .tm{display:block;font-size:10px;margin-top:2px;color:var(--g);font-weight:400}
.pts{display:flex;align-items:center;justify-content:space-between}
.pts .big{font-size:30px;font-weight:800}.pts .big small{font-size:13px;font-weight:600;color:var(--g);margin-left:4px}
.pts .gap{font-size:13px;text-align:right}.pts .gap b{display:block;font-size:15px}
.sub{font-size:12px;color:var(--g);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.more{display:flex;gap:10px;margin:0 14px 12px}
.more div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:#000}
.more div.soon{opacity:.45}
.more div.live{cursor:pointer;border:2px solid var(--y)}
.more div small{color:#666}
.more svg,.nav svg{width:22px;height:22px;display:block;margin:0 auto 4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;font-size:11px;color:var(--g);text-decoration:none}
.nav a.on{color:#000;font-weight:700}.nav a.on svg{background:var(--y);border-radius:10px;width:44px;padding:0 11px}
.page{padding:16px 14px}
.app>.page:first-child{padding-top:16px}
.page h2{font-size:20px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--g);margin:12px 0 6px}
input.in{width:100%;font-size:17px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%;padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px}
.seg button.on{background:#000;color:var(--y);border-color:#000;font-weight:700}
.photo{margin-top:10px;width:100%;aspect-ratio:3/4;background:#fff;border:2px dashed #ccc;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:15px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;background:#000}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:15px}
.toggle input{width:24px;height:24px;accent-color:#000;flex:none}
.back{background:none;border:0;font-size:15px;color:var(--g);padding:4px 0 12px}
.small{font-size:13px}.muted{color:#777;font-size:13px}
.sl-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}.sl-hd h2{margin:0!important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px}
.sl-mon{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#111;color:#FDCD17;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.sl-sub{font-size:12px;color:#888;margin:6px 2px 0;line-height:1.4}
.sl-big{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.sl-track{position:relative;height:8px;background:#efefec;border-radius:4px;margin:12px 0 6px}.sl-track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}.sl-track b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#111;border-radius:1px}
.sl-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.sl-kpi{background:#f6f6f3;border-radius:10px;padding:8px 10px}.sl-kpi .l{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl-kpi .v{font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap}
.sl-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#555;margin-top:7px}.sl-leg span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}.sl-leg .dash::before{background:none;border-top:2px dashed #111;height:0;width:12px;vertical-align:middle}
.sl-gap{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}.sl-need{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sl-need>div{background:#f6f6f3;border-radius:10px;padding:8px 10px}.sl-need .l{font-size:11px;color:#888}.sl-need .v{font-size:18px;font-weight:800;margin-top:2px}
.sl-day{font-size:13px;color:#333;margin-top:8px}.sl-day i{font-style:normal;color:#8a6d00}.sl-day span{color:#999}
.sl-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sl-sheet{background:#fff;width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:16px 12px calc(26px + env(safe-area-inset-bottom))}
.sl-sheet .it{padding:13px 12px;border-radius:10px;font-size:16px;display:flex;justify-content:space-between;cursor:pointer}.sl-sheet .it.on{background:#fff8d6;font-weight:700}
.pcmore{margin:0 14px 14px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:600;text-align:center;cursor:pointer}
.guide{background:#fff8d6;border:1px solid #f0dc8a;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:12px}
.q{scroll-margin-top:calc(62px + env(safe-area-inset-top));background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q.bad{border:2px solid var(--r)}
.qh{display:flex;gap:10px;align-items:flex-start}
.qn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.qt{font-size:16px;font-weight:700;line-height:1.3}
.qs{font-size:13px;color:var(--g);margin-top:3px;line-height:1.4}
.rowb{position:relative;border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:10px;background:#fafaf8}
.rm{position:absolute;top:2px;right:4px;border:0;background:transparent;font-size:22px;color:var(--g);padding:4px 8px;line-height:1}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
select.in,textarea.in,input.in.sm{width:100%;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;color:#000}
textarea.in{min-height:72px;resize:vertical}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;width:140px}
.qty button{border:0;background:none;width:44px;height:42px;font-size:20px}.qty b{flex:1;text-align:center}
.add{margin-top:10px;border:1px solid #000;background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;color:#000}.chips button.on{background:#000;color:var(--y);border-color:#000;font-weight:700}
.lnk{display:block;margin-top:14px;background:none;border:0;color:var(--y);font-size:14px;font-weight:600;padding:0;text-decoration:underline}
.stsel{margin-top:3px;background:#fff;border:1px solid #d8d8d4;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600;color:#333;text-align:left;font-family:inherit}
.pf .store{font-size:13px;color:#5f6368;margin-top:2px}
.stmenu{position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;min-width:250px;max-width:calc(100vw - 60px);max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stmenu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:13px 14px;font-size:15px;color:#000}
.stmenu button.on{font-weight:700}.stmenu small{color:var(--ok);font-weight:600;font-size:12px}
.res{text-align:center;padding:30px 14px 30px}
.res .big{font-size:56px;font-weight:800}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:86%;text-align:center;z-index:90}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:80;font-size:16px;font-weight:600}
table.r{width:100%;border-collapse:collapse;font-size:14px}table.r td{padding:8px 4px;border-bottom:1px solid var(--line)}table.r td:last-child{text-align:right;font-weight:700}
.login{padding:28px 22px 40px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 16px}
details.dd>summary::-webkit-details-marker{display:none}details.dd[open]>summary .ddArr{transform:rotate(90deg);display:inline-block}
</style>
